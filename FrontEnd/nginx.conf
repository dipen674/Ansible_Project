server {
    listen 80;

    # Serve static files from the build directory
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for the API
    location /api/ {
        # The 'backend' service name is resolvable inside the Docker network.
        # This will internally forward requests to http://backend:5000/register
        # when the browser requests http://frontend_host/api/register
        proxy_pass http://backend:5000/; 
        
        # Rewrite the URL so the backend doesn't see the /api/ part
        rewrite ^/api/(.*)$ /$1 break;
        
        # Set headers for the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}